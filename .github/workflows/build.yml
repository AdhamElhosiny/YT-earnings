name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q YouTubeEarningsCalculator.zip
      - name: Test and build release APK
        working-directory: YouTubeEarningsCalculator
        run: gradle test assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeEarningsCalculator-APK
          path: YouTubeEarningsCalculator/app/build/outputs/apk/release/*.apk
